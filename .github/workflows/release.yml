name: 发布正式版本

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: 校验正式版本
    runs-on: ubuntu-24.04
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
    steps:
      - name: 检出完整 Git 历史
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 校验标签、来源与版本顺序
        id: version
        shell: bash
        env:
          # 使用仓库实际默认分支校验发布来源，兼容默认分支名称不同的仓库。
          RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -Eeuo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "正式版本标签必须符合 v1.2.3 格式：$GITHUB_REF_NAME" >&2
            exit 1
          fi
          git check-ref-format "refs/heads/$RELEASE_BRANCH"
          git fetch --no-tags origin "+refs/heads/$RELEASE_BRANCH:refs/remotes/origin/$RELEASE_BRANCH"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "refs/remotes/origin/$RELEASE_BRANCH"; then
            echo "正式版本标签必须指向默认分支 $RELEASE_BRANCH 已包含的提交。" >&2
            exit 1
          fi
          newest_tag="$(git tag --list | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)"
          if [ "$newest_tag" != "$GITHUB_REF_NAME" ]; then
            echo "拒绝发布旧版本 $GITHUB_REF_NAME；当前最高版本是 $newest_tag。" >&2
            exit 1
          fi
          echo "app_version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  linux:
    name: 构建 Linux 服务端 (${{ matrix.arch }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      APP_VERSION: ${{ needs.prepare.outputs.app_version }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 配置 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: 配置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 构建嵌入式前端
        run: npm ci --prefix frontend && npm run build --prefix frontend

      - name: 编译 Linux 服务端二进制
        shell: bash
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          set -Eeuo pipefail
          # 将版本、提交和构建时间写入已嵌入前端的服务端二进制。
          build_time="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          version_ldflags="-s -w -X xianyu-go/internal/version.Version=$APP_VERSION -X xianyu-go/internal/version.Commit=$GITHUB_SHA -X xianyu-go/internal/version.BuildTime=$build_time"
          mkdir -p dist
          go build -trimpath -ldflags="$version_ldflags" \
            -o "dist/qianuhub-xianyu-helper-server-linux-${GOARCH}-${APP_VERSION}.bin" ./cmd/server
          # 首次部署需要独立安装器准备匹配版本的 Playwright driver、Chromium 和系统依赖。
          go build -trimpath -ldflags='-s -w' \
            -o "dist/qianuhub-xianyu-helper-browser-install-linux-${GOARCH}-${APP_VERSION}.bin" ./cmd/browser-install

      - name: 上传 Linux 服务端二进制
        uses: actions/upload-artifact@v7
        with:
          name: qianuhub-server-linux-${{ matrix.arch }}-${{ env.APP_VERSION }}
          path: |
            dist/qianuhub-xianyu-helper-server-linux-${{ matrix.arch }}-${{ env.APP_VERSION }}.bin
            dist/qianuhub-xianyu-helper-browser-install-linux-${{ matrix.arch }}-${{ env.APP_VERSION }}.bin
          if-no-files-found: error

  publish:
    name: 审批并发布正式版本
    needs:
      - prepare
      - linux
    runs-on: ubuntu-24.04
    concurrency:
      group: production-release-publish
      cancel-in-progress: false
    environment:
      name: production-release
    steps:
      - name: 检出正式版本代码
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 下载全部构建产物
        uses: actions/download-artifact@v8
        with:
          pattern: qianuhub-server-linux-*
          path: dist/artifacts
          merge-multiple: true

      - name: 校验 Linux 服务端产物并生成校验和
        shell: bash
        env:
          APP_VERSION: ${{ needs.prepare.outputs.app_version }}
        run: |
          set -Eeuo pipefail
          mkdir -p dist/release

          echo "下载后的构建产物："
          find dist/artifacts -maxdepth 2 -type f -printf '%P\n' | sort

          expected_release_files=(
            "qianuhub-xianyu-helper-server-linux-amd64-$APP_VERSION.bin"
            "qianuhub-xianyu-helper-server-linux-arm64-$APP_VERSION.bin"
            "qianuhub-xianyu-helper-browser-install-linux-amd64-$APP_VERSION.bin"
            "qianuhub-xianyu-helper-browser-install-linux-arm64-$APP_VERSION.bin"
          )
          for release_file in "${expected_release_files[@]}"; do
            source_file="dist/artifacts/$release_file"
            if [ ! -f "$source_file" ]; then
              echo "缺少正式发布产物：$release_file" >&2
              exit 1
            fi
            cp -- "$source_file" dist/release/
          done

          echo "准备发布的 Linux 服务端产物："
          find dist/release -maxdepth 1 -type f -printf '%f\n' | sort
          (cd dist/release && sha256sum * > SHA256SUMS)

      - name: 审批后再次校验最高版本与标签提交
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin --tags --force
          bash tools/release/check-version.sh "$GITHUB_REF_NAME" "$GITHUB_SHA"

      - name: 创建或更新 GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ needs.prepare.outputs.app_version }}
        run: |
          set -Eeuo pipefail
          release_notes_file="dist/release-notes.md"
          git log -1 --format='提交：%h%n%n%B' "$GITHUB_REF_NAME" > "$release_notes_file"
          if [ ! -s "$release_notes_file" ]; then
            printf '%s\n' '本版本提交未提供 release notes。' > "$release_notes_file"
          fi
          mapfile -t release_files < <(find dist/release -maxdepth 1 -type f -print | sort)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --title "QianuHub 闲鱼助手 $APP_VERSION" \
              --notes-file "$release_notes_file"
            gh release upload "$GITHUB_REF_NAME" "${release_files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${release_files[@]}" \
              --verify-tag \
              --notes-file "$release_notes_file" \
              --title "QianuHub 闲鱼助手 $APP_VERSION"
          fi
